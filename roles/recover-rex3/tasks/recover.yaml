- name: Run docker-compose dev 
  when: server_status | int == 1
  community.docker.docker_container_exec:
    container: "server_data_{{ server_number }}"
    argv:
      - /bin/bash
      - "-c"
      - "docker-compose -f /var/opt/{{ backend_dir }}/development/databases/docker-compose.yml up -d"
  ignore_errors: true

- name: Run docker-compose stg
  when: server_status | int == 1
  community.docker.docker_container_exec:
    container: "server_data_{{ server_number }}"
    argv:
      - /bin/bash
      - "-c"
      - "docker-compose -f /var/opt/{{ backend_dir }}/staging/databases/docker-compose.yml up -d"
  ignore_errors: true

- name: Copy start service script
  when: server_status | int == 1
  template:
    src: "templates/{{ template_path }}/start_service.sh.j2"
    dest: "/data/servers/{{ server_number }}/server-data/root/start_service.sh"

- name: Start service
  when: server_status | int == 1
  community.docker.docker_container_exec:
    container: "server_data_{{ server_number }}"
    argv:
      - /bin/bash
      - "-c"
      - "bash /root/start_service.sh"
  ignore_errors: true
