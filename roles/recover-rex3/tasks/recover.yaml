
- name: start server 
  ansible.builtin.shell: echo y | svps start --server-number "{{ server_number }}"
  args:
    executable: /bin/bash
  register: svps_result
  when: server_status | int == 1  
  changed_when: "'started' in svps_result.stdout"
  ignore_errors: true

- name: stop server 
  ansible.builtin.shell: echo y | svps stop --server-number "{{ server_number }}"
  args:
    executable: /bin/bash
  register: svps_result
  when: server_status | int == 0  
  changed_when: "'started' in svps_result.stdout"
  ignore_errors: true

